[package]
name = "collect_links"
version = "0.1.0"
edition = "2024"

[[example]]
name = "collect_links"
path = "collect_links.rs"

[dependencies]
http = "1.4.1"
lychee-lib = { path = "../../lychee-lib",  default-features = false }
regex = "1.12.2"
reqwest = "0.13.4"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"

[features]
email-check = ["lychee-lib/email-check"]
default = []
